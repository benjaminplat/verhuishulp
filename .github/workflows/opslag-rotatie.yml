name: Opslag-rotatie

# jsonblob.com blobs vervallen keihard na 24 uur, ongeacht lezen/schrijven.
# Deze job zet daarom elke 3 uur een verse blob klaar (ruime marge onder de 24u)
# en committeert de data ook permanent in de git-historie als vangnet.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  roteer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bepaal de meest recente data (levende blob, anders backup, anders seed)
        run: |
          set -e
          TOKEN=""
          if [ -f current.json ]; then
            TOKEN=$(jq -r '.token // ""' current.json)
          fi
          DATA=""
          if [ -n "$TOKEN" ]; then
            ID=${TOKEN#jb_}
            HTTP=$(curl -s -o huidige.json -w "%{http_code}" "https://jsonblob.com/api/jsonBlob/$ID" -H "Accept: application/json")
            if [ "$HTTP" = "200" ]; then
              DATA=$(cat huidige.json)
            fi
          fi
          if [ -z "$DATA" ] && [ -f data/backup.json ]; then
            DATA=$(cat data/backup.json)
          fi
          if [ -z "$DATA" ]; then
            DATA=$(cat data/seed.json)
          fi
          echo "$DATA" > payload.json

      - name: Maak een verse jsonblob aan met die data
        run: |
          set -e
          curl -s -D headers.txt -o response.json -X POST "https://jsonblob.com/api/jsonBlob" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            --data-binary @payload.json
          LOCATION=$(grep -i '^Location:' headers.txt | sed -E 's/[Ll]ocation: *//' | tr -d '\r')
          NIEUW_ID=$(basename "$LOCATION")
          if [ -z "$NIEUW_ID" ]; then
            echo "Aanmaken van nieuwe jsonblob is mislukt, response:" && cat response.json && exit 1
          fi
          printf '{"token":"jb_%s","bijgewerkt":"%s"}\n' "$NIEUW_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > current.json
          mkdir -p data
          cp payload.json data/backup.json

      - name: Commit en push (alleen als er iets veranderd is)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current.json data/backup.json
          git diff --cached --quiet || git commit -m "chore: roteer opslag-token (automatisch)"
          git push
