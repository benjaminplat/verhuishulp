<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Verhuishulp · Groningen → Lemmer 🚚</title>
<meta name="description" content="Meld je aan om te helpen met de verhuizing van Groningen naar Lemmer!">
<style>
  :root{
    --oranje:#f97316; --oranje-d:#ea580c; --oranje-l:#ffedd5;
    --navy:#1e293b; --grijs:#64748b; --lichtgrijs:#f1f5f9;
    --groen:#16a34a; --groen-l:#dcfce7;
    --geel:#fbbf24; --blauw:#3b82f6; --blauw-l:#dbeafe;
    --radius:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(160deg,#fff7ed 0%,#ffedd5 45%,#fef3c7 100%);
    min-height:100vh; color:var(--navy);
  }
  #app{max-width:520px;margin:0 auto;padding:16px 16px 96px;min-height:100vh;}
  .scherm{animation:fadein .35s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  h1{font-size:1.9rem;line-height:1.2;margin:.3em 0;font-weight:800;}
  h2{font-size:1.35rem;margin:.4em 0;font-weight:800;}
  h3{font-size:1.05rem;margin:.5em 0 .2em;font-weight:800;}
  p{line-height:1.55;}
  .sub{color:var(--grijs);font-size:1.02rem;}
  .center{text-align:center;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--oranje);color:#fff;border:none;cursor:pointer;
    font-family:inherit;font-size:1.15rem;font-weight:800;
    padding:16px 30px;border-radius:999px;
    box-shadow:0 6px 18px rgba(249,115,22,.35);
    transition:transform .12s ease, box-shadow .12s ease, background .12s;
    text-decoration:none;
  }
  .btn:active{transform:scale(.97);}
  .btn:hover{background:var(--oranje-d);}
  .btn.groot{width:100%;padding:18px;font-size:1.2rem;}
  .btn.rustig{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(30,41,59,.12);border:2px solid #e2e8f0;font-weight:700;}
  .btn.rustig:hover{background:var(--lichtgrijs);}
  .btn:disabled{opacity:.55;cursor:not-allowed;}
  .linkje{background:none;border:none;color:var(--oranje-d);font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;text-decoration:underline;padding:8px;}

  .kaart{background:#fff;border-radius:var(--radius);padding:18px;margin:12px 0;box-shadow:0 3px 14px rgba(30,41,59,.08);}
  .hero{padding:34px 22px;text-align:center;}
  .hero .emoji{font-size:3.4rem;display:block;margin-bottom:6px;}

  input[type=text], textarea{
    width:100%;padding:16px 18px;font-size:1.1rem;font-family:inherit;font-weight:700;
    border:2.5px solid #e2e8f0;border-radius:16px;outline:none;color:var(--navy);
    transition:border .15s;background:#fff;
  }
  textarea{resize:vertical;min-height:84px;font-weight:600;}
  input[type=text]:focus, textarea:focus{border-color:var(--oranje);}
  label.veldlabel{display:block;text-align:left;font-weight:800;margin:16px 0 6px;font-size:1rem;}

  /* handen-keuze */
  .handen{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .hand-optie{
    display:flex;align-items:center;gap:10px;text-align:left;
    padding:13px 16px;border-radius:16px;border:2.5px solid #e2e8f0;background:#fff;
    font-family:inherit;font-weight:800;font-size:1rem;color:var(--navy);cursor:pointer;
    transition:all .12s ease;
  }
  .hand-optie .h-emoji{font-size:1.4rem;}
  .hand-optie.aan{background:var(--groen-l);border-color:var(--groen);color:#166534;}
  .hand-optie:active{transform:scale(.98);}

  .dag{border:2.5px solid transparent;transition:border .15s;}
  .dag.actief{border-color:var(--oranje);}
  .dag-kop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .dag-datum{font-weight:800;font-size:1.08rem;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:.8rem;font-weight:800;padding:4px 10px;border-radius:999px;
    background:var(--blauw-l);color:#1d4ed8;
  }
  .badge.sleutel{background:#fef9c3;color:#a16207;}
  .badge.verhuis{background:var(--blauw-l);color:#1d4ed8;}
  .badge.vol{background:#fee2e2;color:#b91c1c;}

  .dagdelen{display:flex;gap:8px;margin-top:12px;}
  .dagdeel{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:10px 4px;border-radius:14px;border:2px solid #e2e8f0;background:#fff;
    font-family:inherit;font-weight:800;font-size:.9rem;color:var(--grijs);cursor:pointer;
    transition:all .12s ease;
  }
  .dagdeel .dd-emoji{font-size:1.25rem;}
  .dagdeel .dd-sub{font-size:.72rem;font-weight:800;color:var(--grijs);}
  .dagdeel.aan{background:var(--groen-l);border-color:var(--groen);color:#166534;}
  .dagdeel.aan .dd-sub{color:#166534;}
  .dagdeel.uit{opacity:.45;cursor:not-allowed;background:var(--lichtgrijs);}
  .dagdeel:active{transform:scale(.96);}

  .helpers{margin-top:12px;padding-top:10px;border-top:1.5px dashed #e2e8f0;font-size:.92rem;}
  .helpers .h-titel{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--grijs);margin-bottom:6px;}
  .helper-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--lichtgrijs);
    border-radius:999px;padding:4px 12px 4px 6px;margin:0 6px 6px 0;font-weight:700;font-size:.88rem;
  }
  .helper-chip .avatar{
    width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    color:#fff;font-size:.72rem;font-weight:800;flex:none;
  }
  .helper-chip .dd{color:var(--grijs);font-weight:700;font-size:.78rem;}
  .niemand{color:var(--grijs);font-style:italic;}

  .ov-rij{display:flex;gap:10px;align-items:flex-start;margin:8px 0;}
  .ov-rij .ov-dd{flex:none;width:104px;font-weight:800;font-size:.9rem;color:var(--grijs);padding-top:3px;}
  .ov-namen{flex:1;}
  .teller{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:999px;background:var(--oranje-l);color:var(--oranje-d);font-weight:800;font-size:.95rem;padding:0 8px;}

  .team-lid{padding:10px 0;border-bottom:1.5px dashed #e2e8f0;}
  .team-lid:last-child{border-bottom:none;}
  .team-kop{display:flex;align-items:center;gap:8px;font-weight:800;}
  .team-detail{margin:4px 0 0 32px;font-size:.92rem;color:var(--grijs);line-height:1.5;}

  nav{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
    border-top:1.5px solid #e2e8f0;
    display:flex;justify-content:space-around;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  nav button{
    background:none;border:none;font-family:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:.66rem;font-weight:800;color:var(--grijs);padding:6px 5px;border-radius:12px;
  }
  nav button .n-emoji{font-size:1.3rem;}
  nav button.actief{color:var(--oranje-d);background:var(--oranje-l);}

  .melding{
    background:var(--groen-l);color:#166534;border-radius:14px;padding:12px 16px;
    font-weight:800;margin:12px 0;display:flex;gap:8px;align-items:flex-start;
  }
  .melding.fout{background:#fee2e2;color:#b91c1c;}
  .melding.info{background:var(--blauw-l);color:#1d4ed8;}
  .melding.waarschuwing{background:#fef9c3;color:#a16207;}
  .demo-banner{
    background:#fef9c3;color:#a16207;font-weight:800;font-size:.85rem;
    border-radius:12px;padding:8px 14px;text-align:center;margin-bottom:10px;
  }
  .voortgang{display:flex;gap:6px;justify-content:center;margin:10px 0 4px;}
  .voortgang span{width:26px;height:6px;border-radius:99px;background:#e2e8f0;}
  .voortgang span.klaar{background:var(--oranje);}
  .kopieerveld{display:flex;gap:8px;margin:10px 0;}
  .kopieerveld input{font-size:.85rem;font-weight:600;padding:12px;}
  .spinner{
    width:22px;height:22px;border-radius:50%;border:3px solid #fff;border-top-color:transparent;
    animation:spin .8s linear infinite;display:inline-block;
  }
  .spinner.donker{border-color:var(--oranje);border-top-color:transparent;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .confetti{position:fixed;top:-12px;z-index:999;pointer-events:none;border-radius:3px;animation:vallen linear forwards;}
  @keyframes vallen{to{transform:translateY(105vh) rotate(720deg);opacity:.9;}}
  .placeholder{padding:40px 20px;text-align:center;}
  .placeholder .emoji{font-size:3rem;display:block;margin-bottom:8px;}

  /* mascotte (kemphaan) */
  .mascotte{display:flex;align-items:flex-end;justify-content:center;gap:4px;margin:16px 0 2px;}
  .kemphaan{width:118px;cursor:pointer;animation:wiegen 3.5s ease-in-out infinite;transform-origin:bottom center;-webkit-user-select:none;user-select:none;}
  .kemphaan.hop{animation:hop .55s ease;}
  @keyframes wiegen{0%,100%{transform:rotate(3deg);}50%{transform:rotate(-3deg);}}
  @keyframes hop{0%{transform:translateY(0) rotate(3deg);}40%{transform:translateY(-18px) rotate(-8deg);}100%{transform:translateY(0) rotate(3deg);}}
  .bubbel{position:relative;background:var(--oranje-l);color:var(--oranje-d);font-weight:800;font-size:.88rem;line-height:1.35;border-radius:16px;padding:10px 14px;max-width:185px;text-align:left;margin-bottom:52px;}
  .bubbel:after{content:"";position:absolute;right:-14px;bottom:12px;border:8px solid transparent;border-left-color:var(--oranje-l);}
  .mascotte-hint{font-size:.78rem;color:var(--grijs);margin:0 0 6px;}

  /* zwevende verder-balk */
  .zweefbalk{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:40;display:flex;justify-content:center;pointer-events:none;padding:0 14px;}
  .zweefbalk .inner{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:999px;box-shadow:0 10px 28px rgba(30,41,59,.28);padding:8px 8px 8px 18px;max-width:492px;width:100%;}
  .zweefbalk .tel{font-weight:800;font-size:.92rem;color:var(--grijs);}
  .zweefbalk .btn{padding:12px 24px;font-size:1.05rem;box-shadow:none;flex:none;}
  .zweefbalk .inner.puls{animation:tikpuls .25s ease;}
  @keyframes tikpuls{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}

  /* plattegronden */
  .plat-img{width:100%;border-radius:14px;border:1.5px solid #e2e8f0;display:block;cursor:zoom-in;background:#fff;}
  .lightbox{position:fixed;inset:0;background:rgba(15,23,42,.93);z-index:100;overflow:auto;-webkit-overflow-scrolling:touch;}
  .lightbox img{width:175%;max-width:none;display:block;margin:64px auto 40px;background:#fff;border-radius:8px;}
  .lightbox .sluit{position:fixed;top:14px;right:14px;background:#fff;border:none;border-radius:999px;width:44px;height:44px;font-size:1.25rem;font-weight:800;cursor:pointer;z-index:101;box-shadow:0 4px 12px rgba(0,0,0,.3);}

  /* inspiratie: voor/na */
  .insp-wrap{position:relative;margin-top:12px;}
  .insp-wrap .tag{
    position:absolute;top:10px;left:10px;z-index:2;
    background:rgba(30,41,59,.82);color:#fff;font-weight:800;font-size:.8rem;
    padding:4px 14px;border-radius:999px;letter-spacing:.03em;
  }
  .insp-wrap .tag.na{background:var(--groen);}
  .insp-wrap img{cursor:zoom-in;}
  .insp-pijl{text-align:center;font-size:1.5rem;margin:4px 0 -4px;}
  footer{margin-top:26px;text-align:center;color:var(--grijs);font-size:.8rem;}
</style>
</head>

const GEEN_OPTIE = {
  "2026-08-17": ["ochtend"]  // sleuteloverdracht: 's ochtends zelf niet beschikbaar
};
function dagOpties(iso){
  const basis = iso === VERHUISDAG ? LOCATIES : DAGDELEN;
  const uit = GEEN_OPTIE[iso];
  return uit ? basis.filter(o => !uit.includes(o.id)) : basis;
}

function alleDagen(){
  const uit = [];
  const d = new Date(DAG_START + "T12:00:00");
  const eind = new Date(DAG_EIND + "T12:00:00");
  const wd = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
  const mnd = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
  while(d <= eind){
    const iso = d.toISOString().slice(0,10);
    uit.push({
      iso,
      labelLang: wd[d.getDay()][0].toUpperCase() + wd[d.getDay()].slice(1) + " " + d.getDate() + " " + mnd[d.getMonth()]
    });
    d.setDate(d.getDate()+1);
  }
  return uit;
}
const DAGEN = alleDagen();

/* ---------- opslag (gratis, zonder account) ---------- */
/* Providers: jb = jsonblob.com, ec = json.extendsclass.com, demo = lokaal. */
const Opslag = {
  token: null,

  leesTokenUitUrl(){
    const h = (location.hash || "").replace(/^#/, "");
    const q = new URLSearchParams(h.includes("=") ? h : "");
    const p = new URLSearchParams(location.search);
    return q.get("db") || p.get("db") || null;
  },

  async maakNieuw(data){
    try{
      const r = await fetch("https://jsonblob.com/api/jsonBlob", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "Accept":"application/json" },
        body: JSON.stringify(data)
      });
      if(r.ok){
        const loc = r.headers.get("Location") || r.headers.get("location");
        if(loc){
          const id = loc.split("/").pop();
          if(id){ this.token = "jb_" + id; return this.token; }
        }
      }
    }catch(e){ /* volgende provider */ }
    try{
      const r = await fetch("https://json.extendsclass.com/bin", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(data)
      });
      if(r.ok){
        const j = await r.json();
        const id = j.id || (j.uri ? j.uri.split("/").pop() : null);
        if(id){ this.token = "ec_" + id; return this.token; }
      }
    }catch(e){ /* geen */ }
    throw new Error("Kon geen online opslag aanmaken. Controleer je internetverbinding en probeer het opnieuw.");
  },

  _url(){
    if(!this.token) throw new Error("Geen opslag gekoppeld.");
    const [prov, ...rest] = this.token.split("_");
    const id = rest.join("_");
    if(prov === "jb") return "https://jsonblob.com/api/jsonBlob/" + encodeURIComponent(id);
    if(prov === "ec") return "https://json.extendsclass.com/bin/" + encodeURIComponent(id);
    throw new Error("Onbekende opslag.");
  },

  async lees(){
    if(this.token === "demo") return JSON.parse(JSON.stringify(DemoOpslag.data));
    const r = await fetch(this._url(), { headers:{ "Accept":"application/json" }, cache:"no-store" });
    if(!r.ok) throw new Error("Ophalen mislukt (" + r.status + ")");
    return r.json();
  },

  async schrijf(data){
    if(this.token === "demo"){ DemoOpslag.data = JSON.parse(JSON.stringify(data)); return; }
    const r = await fetch(this._url(), {
      method:"PUT",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(data)
    });
    if(!r.ok) throw new Error("Opslaan mislukt (" + r.status + ")");
  }
};
const DemoOpslag = { data: startData() };

/* ---------- hulpjes ---------- */
const app = document.getElementById("app");
const nav = document.getElementById("nav");

function el(tag, attrs, ...kinderen){
  const n = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(k === "class") n.className = v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if(v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for(const kind of kinderen){
    if(kind === null || kind === undefined) continue;
    n.append(kind.nodeType ? kind : document.createTextNode(kind));
  }
  return n;
}
function leeg(node){ while(node.firstChild) node.removeChild(node.firstChild); }
function naamSleutel(naam){ return naam.trim().toLowerCase().replace(/\s+/g," "); }
function initialen(naam){
  return naam.trim().split(/\s+/).map(w => w[0]).join("").slice(0,2).toUpperCase();
}
function avatarKleur(naam){
  let h = 0; for(const c of naamSleutel(naam)) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return AVATAR_KLEUREN[h % AVATAR_KLEUREN.length];
}

  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
/* Het geluid van onze kemphaan: een zacht geroffel met een piepje erachteraan.
   (Gemaakt met WebAudio, dus geen geluidsbestand nodig.) */
function speelKemphaan(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!speelKemphaan.ctx) speelKemphaan.ctx = new AC();
    const ctx = speelKemphaan.ctx;
    if(ctx.state === "suspended") ctx.resume();
    const t0 = ctx.currentTime + 0.02;
    for(let i = 0; i < 3; i++){
      const t = t0 + i * 0.16;
      const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(175 - i * 15, t);
      o.frequency.exponentialRampToValueAtTime(90, t + 0.13);
      f.type = "lowpass"; f.frequency.value = 650;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.28, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      o.connect(f); f.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.16);
    }
    const t = t0 + 0.54;
    const o2 = ctx.createOscillator(), g2 = ctx.createGain();
    o2.type = "sine";
    o2.frequency.setValueAtTime(880, t);
    o2.frequency.exponentialRampToValueAtTime(1450, t + 0.09);
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    o2.connect(g2); g2.connect(ctx.destination);
    o2.start(t); o2.stop(t + 0.14);
  }catch(e){ /* geen geluid beschikbaar, geen probleem */ }
}

function confetti(){
  const kleuren = ["#f97316","#fbbf24","#3b82f6","#16a34a","#ec4899","#8b5cf6"];
  for(let i=0;i<70;i++){
    const s = el("div", { class:"confetti" });
    s.style.left = Math.random()*100 + "vw";
    s.style.width = (6+Math.random()*7) + "px";
    s.style.height = (8+Math.random()*10) + "px";
    s.style.background = kleuren[i % kleuren.length];
    s.style.animationDuration = (1.6+Math.random()*1.6) + "s";
    s.style.animationDelay = (Math.random()*0.5) + "s";
    document.body.append(s);
    setTimeout(() => s.remove(), 4000);
  }
}

const S = {
  data: null,
  naam: "",
  handen: null,        // id uit HANDEN
  specialiteit: "",
  gereedschap: "",
  selectie: {},        // { iso: Set(optie-ids) }
  volMeldingen: [],    // dagen die vol bleken bij het opslaan
  scherm: "home",
  laadFout: null
};

async function vernieuwData(stil){
  try{
    S.data = await Opslag.lees();
    if(!S.data || typeof S.data !== "object" || !S.data.signups) S.data = startData();
    S.laadFout = null;
  }catch(e){
    if(!stil) S.laadFout = e.message || String(e);
  }
}

function helpersVoorDag(iso){
  const uit = [];
  if(!S.data) return uit;
  for(const [key, s] of Object.entries(S.data.signups)){
    const dd = (s.days && s.days[iso]) || [];
    if(dd.length) uit.push({ key, naam: s.name, opties: dd });
  }
  uit.sort((a,b) => a.naam.localeCompare(b.naam, "nl"));
  return uit;
}
/* aantal aanmeldingen op een dag (of, indien optieId, op die optie), zonder exclKey */
function aantalVoor(iso, optieId, exclKey){
  return helpersVoorDag(iso).filter(h =>
    h.key !== exclKey && (!optieId || h.opties.includes(optieId))
  ).length;
}
function optieKort(iso, ids){
  const opts = dagOpties(iso);
  const volgorde = opts.map(o => o.id);
  return ids.slice().sort((a,b) => volgorde.indexOf(a) - volgorde.indexOf(b))
    .map(id => { const o = opts.find(x => x.id === id); return o ? o.emoji : ""; })
    .join(" ");
}

/* --- 3. beschikbaarheid --- */
function tekenBeschikbaar(){
  const mijnKey = naamSleutel(S.naam);
  const bestaand = S.data && S.data.signups[mijnKey];
  app.append(
    demoBanner(),
    voortgang(2),
    el("div",{class:"scherm"},
      el("h2",{class:"center"}, "Wanneer ben je beschikbaar" + (S.naam ? ", " + S.naam.split(" ")[0] : "") + "?"),
      el("p",{class:"sub center"},"Tik aan wanneer je kunt helpen, meerdere keuzes mogelijk. Er is plek voor " + MAX_PER_DAG + " helpers per dag en je ziet meteen wie er al komen.",
        bestaand ? el("b",null," Je eerdere keuzes staan al aangevinkt.") : null)
    )
  );
  const lijst = el("div",{class:"scherm"});
  for(const dag of DAGEN){
    const spec = SPECIAAL[dag.iso];
    const opties = dagOpties(dag.iso);
    const isVerhuisdag = dag.iso === VERHUISDAG;
    const kaart = el("div",{class:"kaart dag" + (S.selectie[dag.iso] && S.selectie[dag.iso].size ? " actief" : "")});
    const dagVol = !isVerhuisdag && aantalVoor(dag.iso, null, mijnKey) >= MAX_PER_DAG;
    const kop = el("div",{class:"dag-kop"},
      el("span",{class:"dag-datum"}, (spec ? spec.icon + " " : "") + dag.labelLang),
      spec ? el("span",{class:"badge " + spec.klasse}, spec.label) : null,
      dagVol ? el("span",{class:"badge vol"},"VOL") : null
    );
    const rij = el("div",{class:"dagdelen"});
    for(const opt of opties){
      const aan = S.selectie[dag.iso] && S.selectie[dag.iso].has(opt.id);
      // vol? (voor de verhuisdag geldt de limiet per locatie, anders per dag)
      const vol = isVerhuisdag
        ? aantalVoor(dag.iso, opt.id, mijnKey) >= MAX_PER_DAG
        : dagVol;
      const geblokkeerd = vol && !aan;
      const bezet = isVerhuisdag ? aantalVoor(dag.iso, opt.id, null) : null;
      const knop = el("button",{class:"dagdeel" + (aan ? " aan" : "") + (geblokkeerd ? " uit" : ""), onclick: () => {
        if(geblokkeerd) return;
        if(!S.selectie[dag.iso]) S.selectie[dag.iso] = new Set();
        const set = S.selectie[dag.iso];
        set.has(opt.id) ? set.delete(opt.id) : set.add(opt.id);
        knop.classList.toggle("aan");
        kaart.classList.toggle("actief", set.size > 0);
        telUpdate();
      }},
        el("span",{class:"dd-emoji"}, opt.emoji),
        opt.label + (isVerhuisdag ? " (" + bezet + "/" + MAX_PER_DAG + ")" : ""),
        opt.sub ? el("span",{class:"dd-sub"}, geblokkeerd ? "VOL" : opt.sub) : (geblokkeerd ? el("span",{class:"dd-sub"},"VOL") : null)
      );
      rij.append(knop);
    }
    kaart.append(kop, rij);
    // wie komen er al?
    const anderen = helpersVoorDag(dag.iso).filter(h => h.key !== mijnKey);
    const helpers = el("div",{class:"helpers"});
    helpers.append(el("div",{class:"h-titel"},"Al aangemeld" + (!isVerhuisdag ? " (" + aantalVoor(dag.iso,null,null) + "/" + MAX_PER_DAG + ")" : "")));
    if(anderen.length){
      for(const h of anderen){
        const av = el("span",{class:"avatar"}, initialen(h.naam));
        av.style.background = avatarKleur(h.naam);
        helpers.append(el("span",{class:"helper-chip"}, av, h.naam, el("span",{class:"dd"}, optieKort(dag.iso, h.opties))));
      }
    }else{
      helpers.append(el("span",{class:"niemand"},"Nog niemand. Word jij de eerste? 😉"));
    }
    kaart.append(helpers);
    lijst.append(kaart);
  }
  app.append(lijst);

  app.append(el("div",{class:"center scherm"},
    el("button",{class:"linkje", onclick: () => toon("naam")},"← Naam aanpassen"),
    el("div",{style:"height:64px;"})));

  // zwevende 'Verder'-balk, altijd in beeld
  const telSpan = el("span",{class:"tel", id:"zweefTel"});
  const balkInner = el("div",{class:"inner"},
    telSpan,
    el("button",{class:"btn", onclick: () => toon("extra")},"Verder →"));
  app.append(el("div",{class:"zweefbalk"}, balkInner));
  telUpdate(true);

  function telUpdate(stil){
    const n = Object.values(S.selectie).reduce((t,set) => t + set.size, 0);
    telSpan.textContent = n === 0 ? "Vink aan wanneer je kunt 👆" :
      n + " keuze" + (n === 1 ? "" : "s") + " aangevinkt 🧡";
    if(!stil){
      balkInner.classList.remove("puls"); void balkInner.offsetWidth; balkInner.classList.add("puls");
    }
  }
}

async function bewaarAanmelding(){
  const knop = document.getElementById("opslaKnop");
  const n = Object.values(S.selectie).reduce((t,set) => t + set.size, 0);
  const sleutel = naamSleutel(S.naam);
  const bestondAl = S.data && S.data.signups[sleutel];
  if(n === 0 && !bestondAl){
    knop.insertAdjacentElement("beforebegin",
      el("div",{class:"melding info"},"ℹ️ Je hebt nog geen dagen aangevinkt. Ga even terug en kies wanneer je kunt."));
    return;
  }
  if(n === 0 && bestondAl && !confirm("Je hebt niets aangevinkt. Wil je je afmelden voor alle dagen?")) return;
  knop.disabled = true; leeg(knop); knop.append(el("span",{class:"spinner"}), " Opslaan…");
  try{
    // vlak voor het opslaan de nieuwste stand ophalen, limieten controleren en samenvoegen
    await vernieuwData(true);
    const data = S.data || startData();
    S.volMeldingen = [];
    const days = {};
    for(const [iso,set] of Object.entries(S.selectie)){
      if(!set.size) continue;
      const dagInfo = DAGEN.find(d => d.iso === iso);
      const naamDag = dagInfo ? dagInfo.labelLang : iso;
      if(iso === VERHUISDAG){
        const ok = [];
        for(const optId of set){
          const anderen = helpersVoorDag(iso).filter(h => h.key !== sleutel && h.opties.includes(optId)).length;
          if(anderen >= MAX_PER_DAG){
            const opt = LOCATIES.find(l => l.id === optId);
            S.volMeldingen.push(naamDag + " (" + (opt ? opt.label : optId) + ")");
          } else ok.push(optId);
        }
        if(ok.length) days[iso] = ok;
      }else{
        const anderen = helpersVoorDag(iso).filter(h => h.key !== sleutel).length;
        if(anderen >= MAX_PER_DAG) S.volMeldingen.push(naamDag);
        else days[iso] = [...set];
      }
    }
    if(Object.keys(days).length === 0) delete data.signups[sleutel];
    else data.signups[sleutel] = {
      name: S.naam.trim(),
      days,
      handen: S.handen || null,
      specialiteit: (S.specialiteit || "").trim(),
      gereedschap: (S.gereedschap || "").trim()
    };
    await Opslag.schrijf(data);
    S.data = data;
    S.selectie = {};
    for(const [iso, dd] of Object.entries(days)) S.selectie[iso] = new Set(dd);
    if(Object.keys(days).length) confetti();
    toon("klaar");
  }catch(e){
    knop.disabled = false; leeg(knop); knop.append("Opnieuw proberen 🔁");
    knop.insertAdjacentElement("beforebegin",
      el("div",{class:"melding fout"},"⚠️ Opslaan lukte niet (" + (e.message || e) + "). Probeer het nog een keer."));
  }
}

/* --- overzicht --- */
let overzichtTimer = null;
function tekenOverzicht(){
  clearInterval(overzichtTimer);
  app.append(demoBanner(), el("h2",{class:"center scherm"},"📅 Wie komt wanneer?"));
  const houder = el("div",{class:"scherm", id:"ovHouder"});
  app.append(houder,
    el("div",{class:"center scherm"},
      el("button",{class:"btn rustig", onclick: async () => { await vernieuwData(); vulOverzicht(); }},"🔄 Ververs"),
      el("div",null, el("button",{class:"linkje", onclick: () => toon(S.naam ? "beschikbaar" : "naam")},
        S.naam ? "Mijn aanmelding aanpassen" : "Ik wil ook helpen!"))));
  vulOverzicht();
  overzichtTimer = setInterval(async () => {
    if(S.scherm !== "overzicht"){ clearInterval(overzichtTimer); return; }
    await vernieuwData(true); vulOverzicht();
  }, 30000);

  function vulOverzicht(){
    const houder = document.getElementById("ovHouder");
    if(!houder) return;
    leeg(houder);
    if(S.laadFout) houder.append(el("div",{class:"melding fout"},"⚠️ " + S.laadFout));
    for(const dag of DAGEN){
      const helpers = helpersVoorDag(dag.iso);
      const spec = SPECIAAL[dag.iso];
      const opties = dagOpties(dag.iso);
      const kaart = el("div",{class:"kaart"});
      kaart.append(el("div",{class:"dag-kop"},
        el("span",{class:"dag-datum"},(spec ? spec.icon + " " : "") + dag.labelLang),
        spec ? el("span",{class:"badge " + spec.klasse}, spec.label) : null,
        el("span",{style:"margin-left:auto;"}, el("span",{class:"teller"}, "👥 " + helpers.length))
      ));
      if(helpers.length){
        for(const opt of opties){
          const namen = helpers.filter(h => h.opties.includes(opt.id));
          if(!namen.length) continue;
          const rij = el("div",{class:"ov-rij"},
            el("span",{class:"ov-dd"}, opt.emoji + " " + opt.label + (dag.iso === VERHUISDAG ? " (" + namen.length + "/" + MAX_PER_DAG + ")" : "")));
          const houderNamen = el("div",{class:"ov-namen"});
          for(const h of namen){
            const av = el("span",{class:"avatar"}, initialen(h.naam));
            av.style.background = avatarKleur(h.naam);
            houderNamen.append(el("span",{class:"helper-chip"}, av, h.naam));
          }
          rij.append(houderNamen);
          kaart.append(rij);
        }
      }else{
        kaart.append(el("p",{class:"niemand", style:"margin:8px 0 0;"},"Nog niemand aangemeld."));
      }
      houder.append(kaart);
    }
    // team: handen, specialiteiten & gereedschap
    const leden = Object.values((S.data && S.data.signups) || {})
      .slice().sort((a,b) => a.name.localeCompare(b.name,"nl"));
    if(leden.length){
      const kaart = el("div",{class:"kaart"});
      kaart.append(el("h3",null,"🧰 Het team: specialiteiten & gereedschap"));
      for(const lid of leden){
        const hand = HANDEN.find(h => h.id === lid.handen);
        const av = el("span",{class:"avatar", style:"width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:800;"}, initialen(lid.name));
        av.style.background = avatarKleur(lid.name);
        const blok = el("div",{class:"team-lid"},
          el("div",{class:"team-kop"}, av, lid.name, hand ? el("span",{class:"dd", style:"color:var(--grijs);font-size:.85rem;font-weight:700;"}, hand.emoji + " " + hand.label) : null));
        const details = [];
        if(lid.specialiteit) details.push("⭐ " + lid.specialiteit);
        if(lid.gereedschap) details.push("🛠️ " + lid.gereedschap);
        if(details.length) blok.append(el("div",{class:"team-detail"}, details.join("   ·   ")));
        kaart.append(blok);
      }
      houder.append(kaart);
    }
  }
}

/* --- plattegrond --- */
function toonLightbox(src, alt){
  const overlay = el("div",{class:"lightbox", onclick: e => { if(e.target === overlay) overlay.remove(); }},
    el("button",{class:"sluit", onclick: () => overlay.remove()},"✕"),
    el("img",{src, alt}));
  document.body.append(overlay);
}
function tekenPlattegrond(){
  app.append(demoBanner(),
    el("h2",{class:"center scherm"},"📐 Zo zien we het voor ons"),
    el("p",{class:"sub center scherm", style:"margin-top:-4px;"},"Tik op een plattegrond om in te zoomen 🔍"),
    el("div",{class:"kaart scherm"},
      el("h3",null,"🏡 Begane grond"),
      el("img",{class:"plat-img", src:IMG.platBegane, alt:"Plattegrond begane grond",

      el("p",{class:"sub", style:"font-size:.88rem;margin-bottom:0;"},"Woonkamer, keuken, entree, badkamer, slaapkamer 1 en de garage.")),
    el("div",{class:"kaart scherm"},
      el("h3",null,"🛏️ Verdieping"),
      el("img",{class:"plat-img", src:IMG.platVerdieping, alt:"Plattegrond verdieping",
        onclick: () => toonLightbox(IMG.platVerdieping, "Plattegrond verdieping")}),
      el("p",{class:"sub", style:"font-size:.88rem;margin-bottom:0;"},"Slaapkamer 2 en 3, overloop, vide, bergingen en de garageverdieping.")));
}

/* ---------- start ---------- */
async function start(){
  leeg(app);
  app.append(el("div",{class:"kaart hero"}, el("span",{class:"spinner donker"}), el("p",{class:"sub"},"Laden…")));
  await vernieuwData();
  toon("home");
}
(function init(){
  const token = Opslag.leesTokenUitUrl();
  const hash = (location.hash || "").replace(/^#/,"");
  if(hash === "demo"){ Opslag.token = "demo"; start(); return; }
  if(token){ Opslag.token = token; start(); return; }
  toon("setup");
})();
</script>
